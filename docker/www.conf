; Pool php-fpm de FIFARDOS.
; El master corre como root (necesario para setuid) y los WORKERS —donde se
; ejecuta el código de la app / superficie de RCE— corren como www-data (no-root).
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
