# FIFARDOS — Docker Compose para Dokploy
# Puedes usar este archivo (tipo "Compose" en Dokploy) o desplegar solo el
# Dockerfile (tipo "Application"). Las variables sensibles se configuran en el
# panel de Dokploy (Environment) — aquí solo van valores por defecto.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fifardos-app
    restart: unless-stopped
    # En Dokploy define las variables en el panel "Environment".
    # Para pruebas locales:  docker compose --env-file .env up --build
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      # Recomendado en producción: usar Postgres/MySQL (ver servicio 'db' abajo).
      # Para SQLite persistente:  DB_CONNECTION=sqlite  y
      #   DB_DATABASE=/var/www/html/storage/app/database.sqlite  (queda en el volumen 'storage').
      # --- Redis: caché, sesiones y colas fuera de la base de datos ---
      # (mejora minijuegos en tiempo real, throttling del MCP/agente y sesiones).
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - storage:/var/www/html/storage
    expose:
      - "80"
    # Dokploy enruta el tráfico vía Traefik hacia el puerto 80 del contenedor.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
      # db:
      #   condition: service_started

  # --- Redis: almacén en memoria para caché, sesiones y colas ---
  # Persistencia RDB por defecto (volumen 'redis') para que sesiones y trabajos
  # sobrevivan un reinicio del contenedor.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- Base de datos recomendada para producción (descomenta si la usas) ---
  # db:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: ${DB_DATABASE:-fifardos}
  #     POSTGRES_USER: ${DB_USERNAME:-fifardos}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
  #   volumes:
  #     - db:/var/lib/postgresql/data

volumes:
  storage:
  redis:
