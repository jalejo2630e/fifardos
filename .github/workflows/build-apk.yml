name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build standalone Capacitor app
        run: npx vite build --config vite.capacitor.config.js

      - name: Sync Capacitor with Android
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore fifardos.keystore \
            -alias fifardos \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass fifardos123 -keypass fifardos123 \
            -dname "CN=FIFARDOS, OU=, O=, L=, S=, C="

      - name: Zipalign APK
        run: |
          ZIPALIGN=$(ls $ANDROID_HOME/build-tools/*/zipalign | head -1)
          $ZIPALIGN -p -f 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            android/app/build/outputs/apk/release/app-release-aligned.apk

      - name: Sign APK
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | head -1)
          $APKSIGNER sign \
            --ks fifardos.keystore \
            --ks-pass pass:fifardos123 \
            --key-pass pass:fifardos123 \
            --ks-key-alias fifardos \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out fifardos.apk \
            android/app/build/outputs/apk/release/app-release-aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fifardos-apk
          path: fifardos.apk
