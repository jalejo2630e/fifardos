name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build standalone Capacitor app
        run: npx vite build --config vite.capacitor.config.js

      - name: Sync Capacitor with Android
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager "platforms;android-35" 2>&1

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore fifardos.keystore \
            -alias fifardos \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass fifardos123 -keypass fifardos123 \
            -dname "CN=FIFARDOS, OU=, O=, L=, S=, C="

      - name: Inject signing config into build.gradle
        run: |
          sed -i '/android {/a\
          \    signingConfigs {\
          \        release {\
          \            storeFile file("../../fifardos.keystore")\
          \            storePassword "fifardos123"\
          \            keyAlias "fifardos"\
          \            keyPassword "fifardos123"\
          \        }\
          \    }' android/app/build.gradle

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fifardos-apk
          path: android/app/build/outputs/apk/release/app-release.apk
