name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build standalone Capacitor app
        run: npx vite build --config vite.capacitor.config.js

      - name: Sync Capacitor with Android
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/15.0/bin/sdkmanager"
          fi
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | $SDKMANAGER "platforms;android-34" 2>&1

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore fifardos.keystore \
            -alias fifardos \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass fifardos123 -keypass fifardos123 \
            -dname "CN=FIFARDOS, OU=, O=, L=, S=, C="

      - name: Build signed release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -PKEYSTORE_PATH=../../fifardos.keystore \
            -PKEYSTORE_PASSWORD=fifardos123 \
            -PKEY_ALIAS=fifardos \
            -PKEY_PASSWORD=fifardos123

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fifardos-apk
          path: android/app/build/outputs/apk/release/app-release.apk
